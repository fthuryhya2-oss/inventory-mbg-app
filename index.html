<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPPG KOTA BAUBAU WOLIO BATARAGURU</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #cbd5e1;
      font-family: Arial, sans-serif;
      z-index: 2;
      transition: opacity .3s ease;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #334155;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div>Memuat aplikasi...</div>
  </div>

  <!--
    GANTI nilai src di bawah ini dengan URL /exec Web App Apps Script Anda.
    Contoh:
    src="https://script.google.com/macros/s/AKfycbyXXXXXXXXXXXXXXXXXXXXXX/exec"
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyTTQJqs8yo3vuLeS9aXcsEfeSsjMYBTB3SnSEnWp9m4OXAN0VO54puaWwGzhxS2ZAi/exec"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.display='none';"
  ></iframe>

</body>
</html>
