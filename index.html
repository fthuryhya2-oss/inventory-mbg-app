<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPPG KOTA BAUBAU WOLIO BATARAGURU</title>

  <!-- iOS: tampilan full-screen tanpa address bar saat "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gudang MBG">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <!-- PWA: dibutuhkan supaya PWABuilder bisa membungkus app ini jadi APK -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* fallback gradient dipakai duluan; kalau background.jpg ada, tampil di atasnya */
      background:
        url('background.jpg') center center / cover no-repeat,
        linear-gradient(135deg, #0f172a 0%, #14532d 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      z-index: 2;
      transition: opacity .3s ease;
    }

    #loader::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
    }

    .spinner {
      position: relative;
      width: 34px;
      height: 34px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    #loader > div:last-child {
      position: relative;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div>Memuat aplikasi...</div>
  </div>

  <!--
    GANTI src di bawah ini dengan URL /exec Web App Apps Script kamu kalau berubah.
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzuMUhy-qNzU5mMUJrIg0v-9mCKBz5qeR6Hkj_lIC82eI8dvTqbQoIpVlJXf9Vu9esKhQ/exec"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.display='none';"
  ></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

</body>
</html>
