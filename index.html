<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPPG KOTA BAUBAU WOLIO BATARAGURU</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a url('background.jpg') center center / cover no-repeat;
      color: #ffffff;
      font-family: Arial, sans-serif;
      z-index: 2;
      transition: opacity .3s ease;
    }

    #loader::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
    }

    .spinner {
      position: relative;
      width: 34px;
      height: 34px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    #loader > div:last-child {
      position: relative;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div>Memuat aplikasi...</div>
  </div>

  <!--
    GANTI nilai src di bawah ini dengan URL /exec Web App Apps Script Anda.
    Contoh:
    src="https://script.google.com/macros/s/AKfycbyXXXXXXXXXXXXXXXXXXXXXX/exec"
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzuMUhy-qNzU5mMUJrIg0v-9mCKBz5qeR6Hkj_lIC82eI8dvTqbQoIpVlJXf9Vu9esKhQ/exec"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.display='none';"
  ></iframe>

</body>
</html>
